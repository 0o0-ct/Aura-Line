[package]
name = "auraline-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
auraline-core = { path = "../auraline-core" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "AudioWorkletProcessor",
    "AudioWorkletNode",
    "AudioContext",
    "AudioBuffer",
    "AudioData",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
