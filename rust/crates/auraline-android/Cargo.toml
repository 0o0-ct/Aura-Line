[package]
name = "auraline-android"
version = "1.0.0"
edition = "2021"
authors = ["AuraLine Audio Engineering Team"]
description = "Android NDK JNI & C FFI bindings for AuraLine Rust Core DSP Engine"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
auraline-core = { path = "../auraline-core" }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"
log = "0.4"
